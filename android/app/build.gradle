plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def keystoreFile = file('notizen.keystore')

android {
    namespace 'at.meinenotizen.app'
    compileSdk 34

    defaultConfig {
        applicationId 'at.meinenotizen.app'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Die Web-App (Ordner /web) wird direkt in die Android-App eingepackt.
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'meine-notizen'
                keyAlias 'notizen'
                keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'meine-notizen'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
