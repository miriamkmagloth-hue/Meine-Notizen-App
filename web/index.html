<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Meine Notizen</title>
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;600;700&family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" data-view="list">
    <aside id="sidebar">
      <div class="brand"><span class="brand-icon" data-icon="notes"></span><span>Meine Notizen</span></div>
      <nav id="nav"></nav>
      <button id="add-notebook" class="nav-add"><span data-icon="plus"></span>Neuer Ordner</button>
      <div class="sidebar-foot">
        <button id="sync-btn" class="sync-btn"></button>
        <button id="design-btn" class="icon-btn" title="Farben &amp; Design" data-icon="palette"></button>
        <button id="settings-btn" class="icon-btn" title="Einstellungen" data-icon="settings"></button>
      </div>
    </aside>
    <div id="scrim"></div>

    <section id="list-pane">
      <header class="pane-head">
        <button id="menu-btn" class="icon-btn drawer-toggle" title="Ordner" data-icon="menu"></button>
        <h1 id="list-title">Alle Notizen</h1>
        <button id="list-sync" class="icon-btn mobile-sync" title="Synchronisieren"></button>
      </header>
      <div class="search-box"><span data-icon="search"></span><input id="search" type="search" placeholder="Notizen durchsuchen" autocomplete="off"></div>
      <div id="note-list" class="note-list"></div>
      <button id="fab" class="fab" title="Neue Notiz" data-icon="plus"></button>
    </section>

    <main id="editor-pane">
      <div id="editor-empty" class="editor-empty">
        <span class="big" data-icon="notes"></span>
        <p>Wähle links eine Notiz – oder lege eine neue an.</p>
        <button id="empty-new" class="btn primary">Neue Notiz</button>
      </div>
      <div id="editor-wrap" class="editor-wrap hidden">
        <header class="pane-head editor-head">
          <button id="back-btn" class="icon-btn back-btn" title="Zurück" data-icon="back"></button>
          <button id="nb-chip" class="chip" title="In anderen Ordner verschieben"></button>
          <span class="spacer"></span>
          <span id="saved-state" class="saved-state"></span>
          <button id="open-app-btn" class="icon-btn quick-only" title="In der App öffnen" data-icon="open"></button>
          <button id="style-btn" class="icon-btn" title="Aussehen der Notiz" data-icon="palette"></button>
          <button id="pin-btn" class="icon-btn" title="Anheften" data-icon="pin"></button>
          <button id="note-more" class="icon-btn" title="Mehr" data-icon="more"></button>
          <button id="done-btn" class="btn primary quick-only">Fertig</button>
        </header>
        <div class="scroll-host">
          <div class="paper">
            <textarea id="note-title" class="note-title" rows="1" placeholder="Titel"></textarea>
            <div id="note-meta" class="note-meta"></div>
            <div id="editor" class="editor"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
