name: App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: Android-App (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signatur-Schlüssel einsetzen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/notizen.keystore
            echo "Schlüssel gefunden."
          else
            echo "::warning::Das Secret KEYSTORE_BASE64 fehlt. Die APK wird mit einem Test-Schlüssel signiert – die Google-Drive-Anmeldung am Handy funktioniert dann NICHT und Updates lassen sich nicht drüber installieren."
          fi

      - name: APK bauen
        run: gradle -p android assembleRelease --no-daemon

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/MeineNotizen-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MeineNotizen-APK
          path: out/*.apk

      # Fester Download-Link fürs Handy: …/releases/latest/download/MeineNotizen.apk
      - name: Als Version veröffentlichen
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp out/*.apk out/MeineNotizen.apk
          gh release create "v1.0.${{ github.run_number }}" out/MeineNotizen.apk \
            --title "Meine Notizen 1.0.${{ github.run_number }}" \
            --notes "${NOTES:-Neue Version}" \
            --latest

  web:
    name: Web-Version (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
